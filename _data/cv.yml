    Research Interests:
      - bullet: "**Computational Fluid Dynamics (CFD):** High-fidelity numerical simulation (DNS/LES), level set and volume of fluid methods, adaptive mesh refinement (AMR), immersed boundary and cut-cell methods"
      - bullet: "**Multiphase Flow:** Air-water-oil systems, ventilated cavitation, bubble dynamics and tracking, high-density-ratio interface tracking"
      - bullet: "**Turbulence:** Compressible turbulence, turbulent mixing, Richtmyer-Meshkov instability"
      - bullet: "**High-Performance Computing:** Multi-GPU parallel computing (C++/CUDA), mixed-precision solvers, large-scale simulation optimization"
      - bullet: "**Applied CFD:** COVID-19 airborne transmission, oil spill dynamics, hydrokinetic turbine design, aquatic canopy flows, digital twin platforms"
      - bullet: "**Quantum-Inspired Computing:** Tensor network methods for Navier-Stokes equations, variational quantum algorithms for fluid mechanics, matrix product state encoding"

